<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Precision Sequence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { forest: '#1B5E20', cream: '#F8FAF8' },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-cream text-gray-900 font-sans antialiased">
  <header class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-lg border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-2 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="precisionsequence logo.jpg" alt="Precision Sequence" class="h-16 w-auto">
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-700">
        <a href="index.html" class="hover:text-forest transition">Home</a>
        <a href="shop.html" class="hover:text-forest transition">Shop</a>
        <a href="quality.html" class="hover:text-forest transition">Quality & CoA</a>
        <a href="about.html" class="hover:text-forest transition">About</a>
        <a href="contact.html" class="text-forest font-semibold">Contact</a>
      </nav>
    </div>
  </header>

  <main class="pt-32 pb-20 px-6">
    <div class="max-w-xl mx-auto">
      <h1 class="text-4xl font-bold mb-2 text-gray-900">Contact</h1>
      <p class="text-gray-500 mb-8">Questions about products, certificates of analysis, or orders.</p>

      <form class="space-y-4" onsubmit="event.preventDefault(); alert('This is a demonstration form. Connect a real backend or email service to receive messages.');">
        <div>
          <label class="block text-sm font-medium mb-1.5 text-gray-700">Name</label>
          <input type="text" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest/30">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5 text-gray-700">Email</label>
          <input type="email" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest/30">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5 text-gray-700">Subject</label>
          <select class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest">
            <option>Product Inquiry</option>
            <option>Certificate of Analysis Request</option>
            <option>Order Status</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5 text-gray-700">Message</label>
          <textarea rows="5" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest/30 resize-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-forest hover:bg-forest-dark text-white font-semibold py-3 rounded-xl transition">
          Send Message
        </button>
      </form>

      <p class="text-xs text-gray-500 mt-6 text-center">
        All products are for research use only. We do not provide medical advice.
      </p>
    </div>
  </main>

  <footer class="border-t border-gray-200 py-8 px-6 text-center text-xs text-gray-500 bg-white">
    © 2026 Precision Sequence • Research Use Only
  </footer>
</body>
</html>
