  <path d="M130 235 Q150 225 170 235" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <text x="150" y="285" text-anchor="middle" font-family="Arial" font-size="11" fill="#1B5E20">Research Grade</text>
