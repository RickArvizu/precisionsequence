<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <rect width="200" height="300" fill="#f8f8f8"/>
  <!-- Cap -->
  <rect x="70" y="20" width="60" height="25" rx="3" fill="#c0c0c0"/>
  <rect x="75" y="40" width="50" height="10" fill="#a0a0a0"/>
  <!-- Bottle neck -->
  <rect x="85" y="50" width="30" height="20" fill="#e8e8e8" stroke="#ccc"/>
  <!-- Bottle body -->
  <rect x="50" y="70" width="100" height="180" rx="15" fill="#ffffff" stroke="#ddd" stroke-width="2"/>
  <!-- Label -->
  <rect x="60" y="100" width="80" height="110" fill="#ffffff" stroke="#1B5E20" stroke-width="1"/>
  <text x="100" y="130" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1B5E20">Precision</text>
  <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1B5E20">Sequence</text>
  <circle cx="100" cy="170" r="15" fill="none" stroke="#1B5E20" stroke-width="1.5"/>
  <path d="M90 170 Q100 165 110 170" fill="none" stroke="#1B5E20" stroke-width="1"/>
  <text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#1B5E20">Research Grade</text>
</svg>
